name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint dependency
        run: python -m pip install flake8

      - name: Run lint
        working-directory: starter/backend
        run: flake8

  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: starter/backend
          push: false
          load: true
          tags: movie-picture-backend:ci

      - name: Run backend tests
        run: docker run --rm -w /app movie-picture-backend:ci pytest -v test_app.py

  build:
    name: Build backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: starter/backend
          push: false
          load: true
          tags: movie-picture-backend:ci